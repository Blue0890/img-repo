name: Update event board

on:
  issues:
    types: [opened, edited, closed, reopened, deleted, labeled, unlabeled]
  schedule:
    - cron: "17 */3 * * *"   # every 3 hours: clears out events that have ended
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pages: write

concurrency:
  group: event-board
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name != 'issues' || contains(github.event.issue.labels.*.name, 'event')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install --quiet pillow

      - name: Build station/events.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ALLOWED_AUTHORS: Blue0890
          EVENT_ISSUE: ${{ github.event.issue.number }}
        run: python .github/scripts/build_events.py

      - name: Commit if anything changed
        id: commit
        run: |
          git add -A station
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update event board"
          git pull --rebase --quiet
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Rebuild GitHub Pages
        if: steps.commit.outputs.changed == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds"
