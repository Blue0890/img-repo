name: Update event board

on:
  issues:
    types: [opened, edited, closed, reopened, deleted, labeled, unlabeled]
  issue_comment:
    types: [created, edited, deleted]   # posting an image in a comment sets the flyer
  schedule:
    - cron: "17 */3 * * *"   # every 3 hours: clears out events that have ended
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: event-board
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name != 'issues' || contains(github.event.issue.labels.*.name, 'event')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main   # always the newest commit, not the one the issue event saw

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install --quiet pillow

      - name: Build station/events.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ALLOWED_AUTHORS: Blue0890
          EVENT_ISSUE: ${{ github.event.issue.number }}
        run: python .github/scripts/build_events.py

      - name: Commit if anything changed
        id: commit
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ALLOWED_AUTHORS: Blue0890
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git add -A station
            if git diff --cached --quiet; then
              echo "changed=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            git commit -q -m "Update event board"
            if git push -q origin HEAD:main; then
              echo "changed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            # Someone else pushed first: start from their version and rebuild.
            git fetch -q origin main
            git reset -q --hard origin/main
            python .github/scripts/build_events.py
          done
          exit 1
